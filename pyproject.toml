[project]
name = "outbound-vision"
version = "0.1.0"
description = "Backend API: Grounding DINO segmentation -> parallel barcode decoding, with a Gemma-verified background dataset collector."
requires-python = ">=3.11"
dependencies = [
    # 2.7 is the first release with cu128 wheels (RTX 50xx / sm_120).
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=4.51,<5",
    "opencv-python-headless>=4.10",
    "pyzbar>=0.1.9",
    "zxing-cpp>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pillow>=10.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
# src/ is imported from the project root; no build backend needed.
package = false
# torch >= 2.7 publishes no macOS x86_64 wheels; resolve only for the hosts we use.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# rapidocr depends on the GUI opencv-python, which would overwrite the headless cv2 module.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: spawns the real dataset worker process"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
# SYSTEM_PROMPT is ported verbatim from legacy/agent.py.
"src/enrich/vlm_agent.py" = ["E501"]
